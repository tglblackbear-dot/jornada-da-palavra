<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"><title>Jornada da Palavra</title></head>
  <body>
    <script>
      // GitHub Pages SPA fallback: preserva o caminho para o BrowserRouter.
      var path = location.pathname.replace(/^\/jornada-da-palavra/, '');
      sessionStorage.setItem('spa-redirect', path + location.search + location.hash);
      location.replace('/jornada-da-palavra/');
    </script>
  </body>
</html>
